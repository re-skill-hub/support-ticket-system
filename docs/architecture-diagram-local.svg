<svg viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Local deployment diagram: Docker Compose runs everything on one support-net bridge network. Your browser talks to the client container (nginx) on port 4200; nginx routes every /api call through the API Gateway (YARP, port 5100), which forwards to TicketService (5101), ResponseService (5102), and NotificationService (5103). Each service has its own database inside one shared SQL Server container (port 1433), and the three services exchange events through RabbitMQ (5672, management UI 15672). TicketService also sends password-reset emails through Mailpit, a local SMTP catcher (port 1025, web UI 8025). Every host port shown is bound to 127.0.0.1 only. Data persists across restarts via named volumes for SQL Server and RabbitMQ.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>

    <linearGradient id="gradClient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dfe3fb"/>
    </linearGradient>
    <linearGradient id="gradService" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f4f8"/>
    </linearGradient>
    <linearGradient id="gradGateway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="gradDb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="gradBus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde3a0"/>
    </linearGradient>
    <linearGradient id="gradMail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf4ff"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="gradNeutral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>

    <symbol id="icon-browser" viewBox="0 0 24 24">
      <rect x="1" y="1" width="22" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="1" y1="6" x2="23" y2="6" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="4" cy="3.5" r="0.9" fill="currentColor"/>
      <circle cx="7" cy="3.5" r="0.9" fill="currentColor"/>
      <circle cx="10" cy="3.5" r="0.9" fill="currentColor"/>
    </symbol>

    <symbol id="icon-gear" viewBox="0 0 24 24">
      <path d="M12 2 L13.6 2 L14.1 4.6 L16.3 5.6 L18.5 4.1 L19.9 5.5 L18.4 7.7 L19.4 9.9 L22 10.4 L22 13.6 L19.4 14.1 L18.4 16.3 L19.9 18.5 L18.5 19.9 L16.3 18.4 L14.1 19.4 L13.6 22 L10.4 22 L9.9 19.4 L7.7 18.4 L5.5 19.9 L4.1 18.5 L5.6 16.3 L4.6 14.1 L2 13.6 L2 10.4 L4.6 9.9 L5.6 7.7 L4.1 5.5 L5.5 4.1 L7.7 5.6 L9.9 4.6 Z" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    </symbol>

    <symbol id="icon-db" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="9" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M3 5 L3 19 A9 3.2 0 0 0 21 19 L21 5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M3 12 A9 3.2 0 0 0 21 12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>

    <symbol id="icon-queue" viewBox="0 0 24 24">
      <rect x="1" y="2.5" width="15" height="4.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <rect x="1" y="9.9" width="15" height="4.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <rect x="1" y="17.3" width="15" height="4.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M19 5 L23 5 M20.7 3 L23 5 L20.7 7" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </symbol>

    <symbol id="icon-mail" viewBox="0 0 24 24">
      <rect x="1.5" y="4" width="21" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M2.5 5.5 L12 13 L21.5 5.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>

    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2 L20 5.5 V11.5 C20 16.5 16.5 20.3 12 22 C7.5 20.3 4 16.5 4 11.5 V5.5 Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M8.5 12 L11 14.5 L15.5 9.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1100" height="760" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">Support Ticketing System — Local Deployment (Docker Compose)</text>

  <!-- Browser -->
  <rect x="450" y="52" width="200" height="45" rx="8" fill="url(#gradNeutral)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-browser" x="462" y="60" width="18" height="14" color="#334155"/>
  <text x="550" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Your browser</text>
  <text x="550" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">http://localhost:4200</text>

  <line x1="550" y1="97" x2="550" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Docker Compose boundary -->
  <rect x="30" y="122" width="1040" height="600" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="140" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#334155">docker-compose.yaml — support-net bridge network</text>
  <text x="50" y="153" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">every host port below is bound to 127.0.0.1 only — not reachable from other machines</text>

  <!-- client -->
  <rect x="450" y="165" width="200" height="48" rx="8" fill="url(#gradClient)" stroke="#4f46e5" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-browser" x="462" y="173" width="18" height="14" color="#4338ca"/>
  <text x="550" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#312e81">client (nginx)</text>
  <text x="550" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4338ca">127.0.0.1:4200 → 80</text>

  <line x1="550" y1="213" x2="550" y2="221" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="562" y="219" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">every /api/* call</text>

  <!-- API Gateway -->
  <rect x="420" y="225" width="260" height="52" rx="8" fill="url(#gradGateway)" stroke="#059669" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-shield" x="432" y="233" width="16" height="16" color="#047857"/>
  <text x="550" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#065f46">api-gateway (YARP)</text>
  <text x="550" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#047857">127.0.0.1:5100 → 8080 — active health checks,</text>
  <text x="550" y="271" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#047857">shared exception handling with the services below</text>

  <line x1="550" y1="277" x2="550" y2="321" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="299" x2="870" y2="299" stroke="#475569" stroke-width="1.5"/>
  <line x1="230" y1="299" x2="230" y2="321" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="870" y1="299" x2="870" y2="321" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="230" y="291" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">auth, tickets, users</text>
  <text x="550" y="291" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">responses</text>
  <text x="870" y="291" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#334155">metrics, notifications</text>

  <!-- services -->
  <rect x="130" y="321" width="200" height="68" rx="8" fill="url(#gradService)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-gear" x="142" y="329" width="16" height="16" color="#334155"/>
  <text x="230" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">ticket-service</text>
  <text x="230" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">127.0.0.1:5101 → 8080</text>
  <text x="230" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">auth, ticket CRUD, admin</text>

  <rect x="450" y="321" width="200" height="68" rx="8" fill="url(#gradService)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-gear" x="462" y="329" width="16" height="16" color="#334155"/>
  <text x="550" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">response-service</text>
  <text x="550" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">127.0.0.1:5102 → 8080</text>
  <text x="550" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">responses, thread history</text>

  <rect x="770" y="321" width="200" height="68" rx="8" fill="url(#gradService)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-gear" x="782" y="329" width="16" height="16" color="#334155"/>
  <text x="870" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">notification-service</text>
  <text x="870" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">127.0.0.1:5103 → 8080</text>
  <text x="870" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">notifications, metrics</text>

  <!-- ticket-service -> mailpit (SMTP), off to the side, distinct from the DB/bus connections everyone shares -->
  <line x1="330" y1="340" x2="500" y2="463" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="345" y="420" font-family="system-ui, sans-serif" font-size="8.5" fill="#6d28d9">password-reset</text>
  <text x="345" y="432" font-family="system-ui, sans-serif" font-size="8.5" fill="#6d28d9">emails (SMTP)</text>

  <!-- RabbitMQ bus -->
  <rect x="130" y="480" width="500" height="50" rx="8" fill="url(#gradBus)" stroke="#d97706" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-queue" x="146" y="492" width="20" height="20" color="#92400e"/>
  <text x="380" y="501" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#78350f">rabbitmq</text>
  <text x="380" y="515" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#92400e">127.0.0.1:5672 AMQP · 127.0.0.1:15672 management UI</text>

  <line x1="230" y1="389" x2="230" y2="478" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="389" x2="550" y2="478" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="478" x2="590" y2="389" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="870" y1="478" x2="870" y2="389" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="500" font-family="system-ui, sans-serif" font-size="9" fill="#334155">TicketCreated, ResponseAdded,</text>
  <text x="900" y="513" font-family="system-ui, sans-serif" font-size="9" fill="#334155">TicketStatusChanged</text>

  <!-- SQL Server -->
  <rect x="130" y="570" width="360" height="80" rx="8" fill="url(#gradNeutral)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-db" x="142" y="578" width="18" height="16" color="#334155"/>
  <text x="310" y="592" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">sqlserver (single instance)</text>
  <text x="310" y="608" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">TicketServiceDb · ResponseServiceDb · NotificationServiceDb</text>
  <text x="310" y="623" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">127.0.0.1:1433 — data persists via the sqlserver-data volume</text>
  <text x="310" y="638" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">each service connects to its own database only</text>

  <line x1="230" y1="389" x2="230" y2="570" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="290" y1="570" x2="550" y2="389" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="330" y1="570" x2="870" y2="389" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3"/>

  <!-- Mailpit -->
  <rect x="510" y="570" width="240" height="80" rx="8" fill="url(#gradMail)" stroke="#7c3aed" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-mail" x="522" y="578" width="18" height="14" color="#6d28d9"/>
  <text x="630" y="594" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4c1d95">mailpit</text>
  <text x="630" y="609" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6d28d9">SMTP catcher for password-reset email</text>
  <text x="630" y="624" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6d28d9">127.0.0.1:1025 SMTP</text>
  <text x="630" y="637" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6d28d9">127.0.0.1:8025 Web UI — view sent emails here</text>

  <!-- Caption -->
  <text x="550" y="700" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">docker compose up --build -d starts all 8 containers; docker compose ps shows health. See docs/running-the-app.md, Track 1.</text>
  <text x="550" y="716" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Data persists across restarts via named volumes (sqlserver-data, rabbitmq-data) until you docker compose down -v.</text>

  <!-- Legend -->
  <line x1="40" y1="732" x2="1060" y2="732" stroke="#e2e8f0" stroke-width="1"/>
  <use href="#icon-browser" x="50" y="740" width="16" height="12" color="#4338ca"/>
  <text x="72" y="750" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Client / browser</text>

  <rect x="212" y="738" width="16" height="12" rx="2" fill="url(#gradGateway)" stroke="#059669" stroke-width="1.3"/>
  <text x="234" y="750" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Gateway (routing)</text>

  <use href="#icon-gear" x="382" y="738" width="14" height="14" color="#334155"/>
  <text x="402" y="750" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Service (API)</text>

  <use href="#icon-db" x="540" y="738" width="14" height="14" color="#334155"/>
  <text x="560" y="750" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Database</text>

  <use href="#icon-queue" x="658" y="739" width="15" height="12" color="#92400e"/>
  <text x="680" y="750" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Message queue</text>

  <use href="#icon-mail" x="808" y="738" width="16" height="12" color="#6d28d9"/>
  <text x="830" y="750" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Email catcher</text>

  <line x1="940" y1="744" x2="965" y2="744" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="975" y="750" font-family="system-ui, sans-serif" font-size="10" fill="#334155">EF Core (own DB)</text>
</svg>
