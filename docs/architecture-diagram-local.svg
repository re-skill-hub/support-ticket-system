<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Local deployment diagram: Docker Compose runs everything on one support-net bridge network. Your browser talks to the client container (nginx) on port 4200; nginx routes every /api call through the API Gateway (YARP, port 5100), which forwards to ticket-service (5101), response-service (5102), and notification-service (5103). Each service owns its own database, all hosted on one sqlserver container (port 1433), and the three services exchange events through RabbitMQ (5672, management UI 15672). Every host port shown is bound to 127.0.0.1 only. Data persists across restarts via named volumes for SQL Server and RabbitMQ.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>

    <linearGradient id="gradClient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dfe3fb"/>
    </linearGradient>
    <linearGradient id="gradService" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f4f8"/>
    </linearGradient>
    <linearGradient id="gradGateway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="gradDb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="gradBus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde3a0"/>
    </linearGradient>
    <linearGradient id="gradNeutral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>

    <symbol id="icon-browser" viewBox="0 0 24 24">
      <rect x="1" y="1" width="22" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="1" y1="6" x2="23" y2="6" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="4" cy="3.5" r="0.9" fill="currentColor"/>
      <circle cx="7" cy="3.5" r="0.9" fill="currentColor"/>
      <circle cx="10" cy="3.5" r="0.9" fill="currentColor"/>
    </symbol>

    <symbol id="icon-gear" viewBox="0 0 24 24">
      <path d="M12 2 L13.6 2 L14.1 4.6 L16.3 5.6 L18.5 4.1 L19.9 5.5 L18.4 7.7 L19.4 9.9 L22 10.4 L22 13.6 L19.4 14.1 L18.4 16.3 L19.9 18.5 L18.5 19.9 L16.3 18.4 L14.1 19.4 L13.6 22 L10.4 22 L9.9 19.4 L7.7 18.4 L5.5 19.9 L4.1 18.5 L5.6 16.3 L4.6 14.1 L2 13.6 L2 10.4 L4.6 9.9 L5.6 7.7 L4.1 5.5 L5.5 4.1 L7.7 5.6 L9.9 4.6 Z" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    </symbol>

    <symbol id="icon-db" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="9" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M3 5 L3 19 A9 3.2 0 0 0 21 19 L21 5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M3 12 A9 3.2 0 0 0 21 12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </symbol>

    <symbol id="icon-queue" viewBox="0 0 24 24">
      <rect x="1" y="2.5" width="15" height="4.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <rect x="1" y="9.9" width="15" height="4.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <rect x="1" y="17.3" width="15" height="4.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M19 5 L23 5 M20.7 3 L23 5 L20.7 7" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </symbol>

    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2 L20 5.5 V11.5 C20 16.5 16.5 20.3 12 22 C7.5 20.3 4 16.5 4 11.5 V5.5 Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M8.5 12 L11 14.5 L15.5 9.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1180" height="760" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">Support Ticketing System — Local Deployment (Docker Compose)</text>

  <!-- Browser -->
  <rect x="440" y="55" width="200" height="45" rx="8" fill="url(#gradNeutral)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-browser" x="452" y="63" width="18" height="14" color="#334155"/>
  <text x="540" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Your browser</text>
  <text x="540" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">http://localhost:4200</text>

  <line x1="540" y1="100" x2="540" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Docker Compose boundary -->
  <rect x="40" y="120" width="1100" height="526" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="140" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#334155">docker-compose.yaml — support-net bridge network</text>
  <text x="60" y="154" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">every host port below is bound to 127.0.0.1 only — not reachable from other machines</text>

  <!-- client -->
  <rect x="440" y="250" width="200" height="48" rx="8" fill="url(#gradClient)" stroke="#4f46e5" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-browser" x="452" y="258" width="18" height="14" color="#4338ca"/>
  <text x="540" y="271" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#312e81">client (nginx)</text>
  <text x="540" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4338ca">127.0.0.1:4200 → 80</text>

  <line x1="540" y1="298" x2="540" y2="306" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="552" y="304" font-family="system-ui, sans-serif" font-size="8.5" fill="#334155">every /api/* call</text>

  <!-- API Gateway -->
  <rect x="415" y="310" width="250" height="52" rx="8" fill="url(#gradGateway)" stroke="#059669" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-shield" x="427" y="318" width="16" height="16" color="#047857"/>
  <text x="540" y="331" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#065f46">api-gateway (YARP)</text>
  <text x="540" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#047857">127.0.0.1:5100 → 8080 — active health checks,</text>
  <text x="540" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#047857">shared exception handling with the services below</text>

  <line x1="540" y1="362" x2="540" y2="406" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="384" x2="850" y2="384" stroke="#475569" stroke-width="1.5"/>
  <line x1="230" y1="384" x2="230" y2="406" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="850" y1="384" x2="850" y2="406" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="230" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">auth, tickets, users</text>
  <text x="540" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">responses</text>
  <text x="850" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">metrics, notifications</text>

  <rect x="145" y="406" width="170" height="70" rx="8" fill="url(#gradService)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-gear" x="155" y="414" width="16" height="16" color="#334155"/>
  <text x="230" y="436" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">ticket-service</text>
  <text x="230" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">127.0.0.1:5101 → 8080</text>
  <text x="230" y="466" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">auth, ticket CRUD, admin</text>

  <rect x="455" y="406" width="170" height="70" rx="8" fill="url(#gradService)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-gear" x="465" y="414" width="16" height="16" color="#334155"/>
  <text x="540" y="436" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">response-service</text>
  <text x="540" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">127.0.0.1:5102 → 8080</text>
  <text x="540" y="466" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">responses, thread history</text>

  <rect x="765" y="406" width="170" height="70" rx="8" fill="url(#gradService)" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-gear" x="775" y="414" width="16" height="16" color="#334155"/>
  <text x="850" y="436" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">notification-service</text>
  <text x="850" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">127.0.0.1:5103 → 8080</text>
  <text x="850" y="466" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">notifications, metrics</text>

  <line x1="315" y1="444" x2="345" y2="444" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="625" y1="444" x2="655" y2="444" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="935" y1="444" x2="965" y2="444" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="375" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">TicketServiceDb</text>
  <g filter="url(#softShadow)">
    <rect x="345" y="428" width="60" height="32" fill="url(#gradDb)" stroke="#64748b" stroke-width="1.3"/>
    <path d="M 345,460 A 30,6 0 0 0 405,460" fill="url(#gradDb)" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="375" cy="428" rx="30" ry="6" fill="url(#gradDb)" stroke="#64748b" stroke-width="1.3"/>
  </g>

  <text x="685" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">ResponseServiceDb</text>
  <g filter="url(#softShadow)">
    <rect x="655" y="428" width="60" height="32" fill="url(#gradDb)" stroke="#64748b" stroke-width="1.3"/>
    <path d="M 655,460 A 30,6 0 0 0 715,460" fill="url(#gradDb)" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="685" cy="428" rx="30" ry="6" fill="url(#gradDb)" stroke="#64748b" stroke-width="1.3"/>
  </g>

  <text x="995" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">NotificationServiceDb</text>
  <g filter="url(#softShadow)">
    <rect x="965" y="428" width="60" height="32" fill="url(#gradDb)" stroke="#64748b" stroke-width="1.3"/>
    <path d="M 965,460 A 30,6 0 0 0 1025,460" fill="url(#gradDb)" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="995" cy="428" rx="30" ry="6" fill="url(#gradDb)" stroke="#64748b" stroke-width="1.3"/>
  </g>

  <rect x="140" y="576" width="900" height="50" rx="8" fill="url(#gradBus)" stroke="#d97706" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-queue" x="156" y="588" width="20" height="20" color="#92400e"/>
  <text x="598" y="599" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#78350f">rabbitmq (MassTransit)</text>
  <text x="598" y="613" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#92400e">127.0.0.1:5672 AMQP · 127.0.0.1:15672 management UI</text>
  <text x="1025" y="594" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">↓ publish · ↑ consume</text>

  <line x1="230" y1="476" x2="230" y2="574" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242" y="518" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketCreated</text>
  <text x="242" y="534" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketStatusChanged</text>

  <line x1="525" y1="476" x2="525" y2="574" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="513" y="518" text-anchor="end" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">ResponseAdded</text>
  <line x1="555" y1="574" x2="555" y2="476" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="567" y="518" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketCreated</text>
  <text x="567" y="534" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketStatusChanged</text>

  <line x1="850" y1="574" x2="850" y2="476" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="862" y="510" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketCreated</text>
  <text x="862" y="526" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">ResponseAdded</text>
  <text x="862" y="542" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketStatusChanged</text>

  <!-- Caption -->
  <text x="590" y="672" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">docker compose up --build -d starts every container; docker compose ps shows health. See docs/running-the-app.md, Track 1.</text>
  <text x="590" y="688" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">All three databases run on one sqlserver container (127.0.0.1:1433); data persists via named volumes until docker compose down -v.</text>

  <!-- Legend -->
  <line x1="40" y1="712" x2="1140" y2="712" stroke="#e2e8f0" stroke-width="1"/>
  <use href="#icon-browser" x="50" y="722" width="16" height="12" color="#4338ca"/>
  <text x="72" y="732" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Client (browser)</text>

  <rect x="222" y="720" width="16" height="12" rx="2" fill="url(#gradGateway)" stroke="#059669" stroke-width="1.3"/>
  <text x="244" y="732" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Gateway (routing)</text>

  <use href="#icon-gear" x="392" y="720" width="14" height="14" color="#334155"/>
  <text x="412" y="732" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Service (API)</text>

  <use href="#icon-db" x="550" y="720" width="14" height="14" color="#64748b"/>
  <text x="570" y="732" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Database</text>

  <use href="#icon-queue" x="668" y="721" width="15" height="12" color="#92400e"/>
  <text x="690" y="732" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Message queue</text>
</svg>
