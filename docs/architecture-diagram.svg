<svg viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Architecture diagram: the Angular client calls TicketService, ResponseService, and NotificationService directly over HTTP; each service owns an isolated database; the three services never call each other directly, they only exchange TicketCreated, TicketStatusChanged, and ResponseAdded events through RabbitMQ.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="430" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">Support Ticketing System — Service Architecture</text>

  <!-- Client -->
  <rect x="330" y="54" width="200" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="430" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#312e81">Angular Client</text>
  <text x="430" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4338ca">port 4200</text>

  <!-- Distribution manifold: client -> three services -->
  <line x1="430" y1="104" x2="430" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="128" x2="740" y2="128" stroke="#475569" stroke-width="1.5"/>
  <line x1="120" y1="128" x2="120" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="128" x2="740" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="120" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">auth, tickets</text>
  <text x="430" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">responses</text>
  <text x="740" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">notifications, metrics</text>

  <!-- Service boxes -->
  <rect x="35" y="150" width="170" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">TicketService</text>
  <text x="120" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">port 5101</text>
  <text x="120" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">auth, ticket CRUD</text>

  <rect x="345" y="150" width="170" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">ResponseService</text>
  <text x="430" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">port 5102</text>
  <text x="430" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">responses, thread history</text>

  <rect x="655" y="150" width="170" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="740" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">NotificationService</text>
  <text x="740" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">port 5103</text>
  <text x="740" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">notifications, metrics</text>

  <!-- Service -> DB connectors -->
  <line x1="205" y1="188" x2="235" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="515" y1="188" x2="545" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="825" y1="188" x2="855" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DB cylinders (label sits above, entirely inside the service row) -->
  <text x="265" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">TicketServiceDb</text>
  <g>
    <rect x="235" y="172" width="60" height="32" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <path d="M 235,204 A 30,6 0 0 0 295,204" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="265" cy="172" rx="30" ry="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  </g>

  <text x="575" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">ResponseServiceDb</text>
  <g>
    <rect x="545" y="172" width="60" height="32" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <path d="M 545,204 A 30,6 0 0 0 605,204" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="575" cy="172" rx="30" ry="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  </g>

  <text x="885" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">NotificationServiceDb</text>
  <g>
    <rect x="855" y="172" width="60" height="32" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <path d="M 855,204 A 30,6 0 0 0 915,204" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="885" cy="172" rx="30" ry="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  </g>

  <!-- Bus -->
  <rect x="30" y="320" width="900" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#78350f">RabbitMQ (MassTransit)</text>
  <text x="915" y="338" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">↓ publish · ↑ consume</text>

  <!-- Service <-> Bus connectors (labels sit beside their line, never on top of it) -->
  <line x1="120" y1="220" x2="120" y2="318" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="132" y="262" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketCreated</text>
  <text x="132" y="278" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketStatusChanged</text>

  <line x1="415" y1="220" x2="415" y2="318" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="403" y="262" text-anchor="end" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">ResponseAdded</text>
  <line x1="445" y1="318" x2="445" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="457" y="262" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketCreated</text>
  <text x="457" y="278" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketStatusChanged</text>

  <line x1="740" y1="318" x2="740" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="752" y="254" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketCreated</text>
  <text x="752" y="270" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">ResponseAdded</text>
  <text x="752" y="286" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketStatusChanged</text>

  <!-- Caption -->
  <text x="480" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Client calls each service directly — the services never call each other directly.</text>
  <text x="480" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">They only exchange events through RabbitMQ, and each owns an isolated database.</text>
</svg>
