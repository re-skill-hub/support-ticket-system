<svg viewBox="0 0 1180 1000" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="End-to-end deployment architecture: GitHub triggers an Azure DevOps pipeline (Validate, BuildAndPush, DeployDev, SmokeTest) that reads secrets from Key Vault, authenticates to AKS as the least-privilege ci-deployer ServiceAccount, and pushes images through ACR. Inside the AKS cluster, ingress-nginx and cert-manager terminate TLS in front of the Angular client, which calls TicketService, ResponseService, and NotificationService; the three services exchange events only through RabbitMQ. Container Insights streams logs and metrics to Log Analytics.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="1000" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">Support Ticketing System — End-to-End Deployment Architecture</text>

  <!-- GitHub -->
  <rect x="490" y="55" width="200" height="45" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="590" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">GitHub</text>
  <text x="590" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">source repository (main / feature branches)</text>

  <line x1="590" y1="100" x2="590" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Azure DevOps Pipeline -->
  <rect x="230" y="125" width="720" height="115" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="250" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Azure DevOps Pipeline</text>
  <text x="410" y="145" font-family="system-ui, sans-serif" font-size="9.5" fill="#b91c1c">BuildAndPush / DeployDev / SmokeTest skipped on PRs</text>

  <rect x="250" y="155" width="150" height="55" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
  <text x="325" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Validate</text>
  <text x="325" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">build/test .NET + Angular</text>
  <text x="325" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">kustomize render check</text>

  <rect x="420" y="155" width="150" height="55" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
  <text x="495" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">BuildAndPush</text>
  <text x="495" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">build + push image</text>
  <text x="495" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">per service</text>

  <rect x="590" y="155" width="150" height="55" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
  <text x="665" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">DeployDev</text>
  <text x="665" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">env: support-ticketing-dev</text>
  <text x="665" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">manual approval</text>

  <rect x="760" y="155" width="150" height="55" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
  <text x="835" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">SmokeTest</text>
  <text x="835" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">curl --fail against</text>
  <text x="835" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">clientEndpoint</text>

  <line x1="400" y1="182" x2="420" y2="182" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="182" x2="590" y2="182" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="182" x2="760" y2="182" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Key Vault callout -->
  <rect x="30" y="260" width="180" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Key Vault</text>
  <text x="120" y="299" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">6 secrets, RBAC-mode</text>
  <text x="120" y="311" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">linked variable group</text>

  <line x1="210" y1="280" x2="618" y2="210" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="330" y="255" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">reads secrets</text>

  <!-- ci-deployer callout -->
  <rect x="970" y="260" width="180" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="1060" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">ci-deployer</text>
  <text x="1060" y="299" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">namespace-scoped</text>
  <text x="1060" y="311" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">ServiceAccount token</text>

  <line x1="712" y1="210" x2="990" y2="272" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="800" y="250" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">authenticates as</text>

  <line x1="1060" y1="320" x2="1060" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1000" y="378" font-family="system-ui, sans-serif" font-size="9" fill="#334155">kubectl apply /</text>
  <text x="1000" y="391" font-family="system-ui, sans-serif" font-size="9" fill="#334155">set image</text>

  <!-- ACR -->
  <rect x="280" y="345" width="200" height="55" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="380" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">ACR</text>
  <text x="380" y="384" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Azure Container Registry</text>

  <line x1="495" y1="210" x2="395" y2="345" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="280" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">docker push</text>

  <line x1="380" y1="400" x2="380" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="392" y="418" font-family="system-ui, sans-serif" font-size="9" fill="#334155">image pull</text>

  <!-- AKS boundary -->
  <rect x="40" y="430" width="1100" height="470" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="452" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#334155">AKS: aks-support-ticket-dev-01 — namespace: support-ticketing-dev</text>

  <!-- inbound TLS traffic -->
  <line x1="540" y1="405" x2="540" y2="498" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="555" y="450" font-family="system-ui, sans-serif" font-size="9" fill="#334155">https://&lt;static-ip&gt;.nip.io</text>

  <!-- ingress-nginx + cert-manager -->
  <rect x="440" y="500" width="200" height="50" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="519" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1e293b">ingress-nginx + cert-manager</text>
  <text x="540" y="533" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">TLS via Let's Encrypt (HTTP-01)</text>

  <line x1="540" y1="550" x2="540" y2="558" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Reused app diagram content, translated +110/+506 -->
  <rect x="440" y="560" width="200" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="540" y="582" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#312e81">Angular Client</text>
  <text x="540" y="598" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4338ca">port 4200</text>

  <line x1="540" y1="610" x2="540" y2="656" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="634" x2="850" y2="634" stroke="#475569" stroke-width="1.5"/>
  <line x1="230" y1="634" x2="230" y2="656" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="850" y1="634" x2="850" y2="656" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="230" y="626" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">auth, tickets</text>
  <text x="540" y="626" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">responses</text>
  <text x="850" y="626" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">notifications, metrics</text>

  <rect x="145" y="656" width="170" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="230" y="686" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">TicketService</text>
  <text x="230" y="702" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">port 5101</text>
  <text x="230" y="716" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">auth, ticket CRUD</text>

  <rect x="455" y="656" width="170" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="540" y="686" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">ResponseService</text>
  <text x="540" y="702" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">port 5102</text>
  <text x="540" y="716" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">responses, thread history</text>

  <rect x="765" y="656" width="170" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="850" y="686" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">NotificationService</text>
  <text x="850" y="702" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">port 5103</text>
  <text x="850" y="716" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b">notifications, metrics</text>

  <line x1="315" y1="694" x2="345" y2="694" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="625" y1="694" x2="655" y2="694" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="935" y1="694" x2="965" y2="694" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="375" y="668" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">TicketServiceDb</text>
  <g>
    <rect x="345" y="678" width="60" height="32" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <path d="M 345,710 A 30,6 0 0 0 405,710" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="375" cy="678" rx="30" ry="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  </g>

  <text x="685" y="668" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">ResponseServiceDb</text>
  <g>
    <rect x="655" y="678" width="60" height="32" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <path d="M 655,710 A 30,6 0 0 0 715,710" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="685" cy="678" rx="30" ry="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  </g>

  <text x="995" y="668" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">NotificationServiceDb</text>
  <g>
    <rect x="965" y="678" width="60" height="32" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <path d="M 965,710 A 30,6 0 0 0 1025,710" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="995" cy="678" rx="30" ry="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  </g>

  <rect x="140" y="826" width="900" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="590" y="855" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#78350f">RabbitMQ (MassTransit)</text>
  <text x="1025" y="844" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">↓ publish · ↑ consume</text>

  <line x1="230" y1="726" x2="230" y2="824" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="242" y="768" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketCreated</text>
  <text x="242" y="784" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketStatusChanged</text>

  <line x1="525" y1="726" x2="525" y2="824" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="513" y="768" text-anchor="end" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">ResponseAdded</text>
  <line x1="555" y1="824" x2="555" y2="726" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="567" y="768" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketCreated</text>
  <text x="567" y="784" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketStatusChanged</text>

  <line x1="850" y1="824" x2="850" y2="726" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="862" y="760" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketCreated</text>
  <text x="862" y="776" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">ResponseAdded</text>
  <text x="862" y="792" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">TicketStatusChanged</text>

  <!-- Container Insights callout -->
  <rect x="980" y="750" width="140" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="1050" y="773" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1e293b">Container Insights</text>
  <text x="1050" y="787" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">→ Log Analytics</text>

  <line x1="315" y1="700" x2="978" y2="780" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="600" y="748" font-family="system-ui, sans-serif" font-size="9" fill="#334155">logs + metrics</text>

  <!-- Caption -->
  <text x="590" y="935" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">BuildAndPush, DeployDev, and SmokeTest are skipped on pull-request-triggered runs — only Validate gates a PR.</text>
  <text x="590" y="951" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">The pipeline deploys as the least-privilege ci-deployer ServiceAccount, never the cluster-admin credential AKS hands out by default.</text>
</svg>
