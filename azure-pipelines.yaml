trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  - name: services
    type: object
    default:
      - name: ticket-service
        dockerfile: services/TicketService/Dockerfile
      - name: response-service
        dockerfile: services/ResponseService/Dockerfile
      - name: notification-service
        dockerfile: services/NotificationService/Dockerfile
      - name: api-gateway
        dockerfile: services/ApiGateway/Dockerfile
      - name: client
        dockerfile: client/Dockerfile

variables:
  - group: support-ticketing-dev
  - group: support-ticketing-dev-secrets
  - name: imageTag
    value: $(Build.SourceVersion)
  - name: dotnetVersion
    value: '10.0.x'
  - name: nodeVersion
    value: '24.x'
  - name: overlayPath
    value: k8s/azure-dev
  - name: NUGET_PACKAGES
    value: $(Pipeline.Workspace)/.nuget/packages

stages:
  - stage: Validate
    displayName: Validate
    jobs:
      - job: Validate
        timeoutInMinutes: 15
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: Cache NuGet packages
            inputs:
              key: 'nuget | "$(Agent.OS)" | **/*.csproj'
              restoreKeys: 'nuget | "$(Agent.OS)"'
              path: $(NUGET_PACKAGES)

          - script: dotnet restore SupportTicketing.slnx
            displayName: Restore .NET

          - script: dotnet build SupportTicketing.slnx --no-restore --configuration Release
            displayName: Build .NET

          - script: dotnet format SupportTicketing.slnx --verify-no-changes
            displayName: Lint .NET (dotnet format)

          - script: |
              set -euo pipefail
              dotnet test SupportTicketing.slnx --no-build --configuration Release \
                --logger "trx" \
                --collect:"XPlat Code Coverage" --settings coverlet.runsettings \
                --results-directory "$(Agent.TempDirectory)/dotnet-test-results"
            displayName: Test .NET

          - task: PublishTestResults@2
            displayName: Publish .NET test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/dotnet-test-results/**/*.trx'

          - script: |
              set -euo pipefail
              dotnet tool install -g dotnet-reportgenerator-globaltool
              reportgenerator \
                -reports:"$(Agent.TempDirectory)/dotnet-test-results/**/coverage.cobertura.xml" \
                -targetdir:"$(Agent.TempDirectory)/dotnet-coverage-report" \
                -reporttypes:"Cobertura;TextSummary"
            displayName: Merge .NET coverage

          - script: |
              # coverlet's XPlat Code Coverage collector has no built-in threshold check
              # (see coverlet.collector's own VSTestIntegration.md), so the merged
              # reportgenerator summary is parsed here instead.
              set -euo pipefail
              summary="$(Agent.TempDirectory)/dotnet-coverage-report/Summary.txt"
              coverage=$(grep -m1 "Line coverage:" "$summary" | grep -oE "[0-9]+(\.[0-9]+)?")
              threshold=75
              echo "Line coverage: ${coverage}% (threshold ${threshold}%)"
              awk -v cov="$coverage" -v th="$threshold" 'BEGIN { exit !(cov + 0 >= th + 0) }'
            displayName: Enforce .NET coverage threshold

          - task: PublishCodeCoverageResults@2
            displayName: Publish .NET code coverage
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/dotnet-coverage-report/Cobertura.xml'

          - task: Cache@2
            displayName: Cache npm packages
            inputs:
              key: 'npm | "$(Agent.OS)" | client/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(Pipeline.Workspace)/.npm

          - script: npm ci
            displayName: Install Angular dependencies
            workingDirectory: client
            env:
              npm_config_cache: $(Pipeline.Workspace)/.npm

          - script: npm run lint
            displayName: Lint Angular
            workingDirectory: client

          - script: npm test -- --watch=false
            displayName: Test Angular
            workingDirectory: client
            env:
              CI: true

          - task: PublishTestResults@2
            displayName: Publish Angular test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'client/test-results/junit.xml'

          - task: PublishCodeCoverageResults@2
            displayName: Publish Angular code coverage
            inputs:
              summaryFileLocation: 'client/coverage/client/cobertura-coverage.xml'

          - script: npm run build
            displayName: Build Angular
            workingDirectory: client

          - script: kubectl kustomize $(overlayPath) > /dev/null
            displayName: Validate Kubernetes overlay renders

  - stage: BuildAndPush
    displayName: Build and push images
    dependsOn: Validate
    # Pull requests only run Validate — pushing images and deploying must wait until the PR is merged.
    # Gate on the branch itself, not just "not a PR build" — a manually-queued run (Build.Reason
    # = 'Manual') against an unmerged feature branch would otherwise sail through this check and
    # deploy unreviewed code, since only PR *validation* builds carry Build.Reason='PullRequest'.
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildAndPush
        timeoutInMinutes: 15
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: ACR login
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: az acr login --name "$(acrName)"

          - ${{ each svc in parameters.services }}:
            - script: docker build -t "$(acrLoginServer)/${{ svc.name }}:$(imageTag)" -f ${{ svc.dockerfile }} .
              displayName: 'Build ${{ svc.name }}'

            - script: docker push "$(acrLoginServer)/${{ svc.name }}:$(imageTag)"
              displayName: 'Push ${{ svc.name }}'

          - task: PublishPipelineArtifact@1
            displayName: Publish Kubernetes overlay
            inputs:
              targetPath: $(overlayPath)
              artifact: kubernetes-overlay

  - stage: DeployDev
    displayName: Deploy development
    dependsOn: BuildAndPush
    # See the branch-gate comment on the BuildAndPush stage above.
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDev
        environment: support-ticketing-dev
        timeoutInMinutes: 10
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Deploy to AKS
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      overlay="$(Pipeline.Workspace)/kubernetes-overlay"
                      # az aks get-credentials only populates the cluster server URL + CA cert here;
                      # the credential it hands out is swapped below for the namespace-scoped
                      # ci-deployer ServiceAccount token (see k8s/azure-dev/ci-deployer-rbac.yaml),
                      # since this cluster has no AAD integration and can't scope Azure RBAC instead.
                      az aks get-credentials --resource-group "$(resourceGroup)" --name "$(aksName)" --overwrite-existing
                      kubectl config set-credentials ci-deployer --token="$K8S_CI_TOKEN"
                      kubectl config set-context --current --user=ci-deployer --namespace="$(kubernetesNamespace)"
                      kubectl apply -f "$overlay/namespace.yaml"
                      kubectl create secret generic app-secrets \
                        --namespace "$(kubernetesNamespace)" \
                        --from-literal=MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
                        --from-literal=RABBITMQ_USER="$RABBITMQ_USER" \
                        --from-literal=RABBITMQ_PASS="$RABBITMQ_PASS" \
                        --from-literal=JWT_SECRET="$JWT_SECRET" \
                        --from-literal=INITIAL_ADMIN_PASSWORD="$INITIAL_ADMIN_PASSWORD" \
                        --from-literal=LOCAL_AGENT_PASSWORD="$LOCAL_AGENT_PASSWORD" \
                        --dry-run=client -o yaml | kubectl apply -f -
                      sed -i "s#__CLIENT_ENDPOINT__#$(clientEndpoint)#g" "$overlay/kustomization.yaml"
                      sed -i "s#__INITIAL_ADMIN_EMAIL__#$(initialAdminEmail)#g" "$overlay/kustomization.yaml"
                      sed -i "s#__INITIAL_ADMIN_FULL_NAME__#$(initialAdminFullName)#g" "$overlay/kustomization.yaml"
                      sed -i "s#__LOCAL_AGENT_EMAIL__#$(localAgentEmail)#g" "$overlay/kustomization.yaml"
                      sed -i "s#__LOCAL_AGENT_FULL_NAME__#$(localAgentFullName)#g" "$overlay/kustomization.yaml"
                      for d in ticket-service response-service notification-service; do
                        kubectl -n "$(kubernetesNamespace)" set env "deployment/$d" Cors__AllowedOrigin- 2>/dev/null || true
                      done
                      kubectl apply -k "$overlay"
                  env:
                    MSSQL_SA_PASSWORD: $(MSSQL-SA-PASSWORD)
                    RABBITMQ_USER: $(RABBITMQ-USER)
                    RABBITMQ_PASS: $(RABBITMQ-PASS)
                    JWT_SECRET: $(JWT-SECRET)
                    K8S_CI_TOKEN: $(K8S-CI-TOKEN)
                    INITIAL_ADMIN_PASSWORD: $(INITIAL-ADMIN-PASSWORD)
                    LOCAL_AGENT_PASSWORD: $(LOCAL-AGENT-PASSWORD)

                - ${{ each svc in parameters.services }}:
                  - script: |
                      kubectl -n "$(kubernetesNamespace)" set image deployment/${{ svc.name }} ${{ svc.name }}="$(acrLoginServer)/${{ svc.name }}:$(imageTag)"
                      kubectl -n "$(kubernetesNamespace)" rollout status deployment/${{ svc.name }} --timeout=5m
                    displayName: 'Deploy ${{ svc.name }}'

                - task: AzureCLI@2
                  displayName: Capture AKS diagnostics on failure
                  condition: failed()
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials --resource-group "$(resourceGroup)" --name "$(aksName)" --overwrite-existing || true
                      kubectl config set-credentials ci-deployer --token="$K8S_CI_TOKEN" || true
                      kubectl config set-context --current --user=ci-deployer --namespace="$(kubernetesNamespace)" || true
                      kubectl -n "$(kubernetesNamespace)" get pods -o wide || true
                      kubectl -n "$(kubernetesNamespace)" get events --sort-by=.lastTimestamp || true
                      kubectl -n "$(kubernetesNamespace)" describe pods || true
                  env:
                    K8S_CI_TOKEN: $(K8S-CI-TOKEN)

  - stage: SmokeTest
    displayName: Smoke test
    dependsOn: DeployDev
    # See the branch-gate comment on the BuildAndPush stage above.
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        timeoutInMinutes: 5
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: |
              set -euo pipefail
              test -n "$(clientEndpoint)"
              curl --fail --retry 5 --retry-delay 5 "$(clientEndpoint)/"
            displayName: Verify client endpoint

  - stage: E2ETest
    displayName: End-to-end test
    dependsOn: SmokeTest
    # See the branch-gate comment on the BuildAndPush stage above.
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: E2ETest
        timeoutInMinutes: 15
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: Install Angular dependencies
            workingDirectory: client

          - script: npx playwright install --with-deps chromium
            displayName: Install Playwright browsers

          - script: npx playwright test
            displayName: Run e2e suite against dev environment
            workingDirectory: client
            env:
              CI: true
              E2E_BASE_URL: $(clientEndpoint)
              LOCAL_AGENT_EMAIL: $(localAgentEmail)
              LOCAL_AGENT_PASSWORD: $(LOCAL-AGENT-PASSWORD)
              INITIAL_ADMIN_EMAIL: $(initialAdminEmail)
              INITIAL_ADMIN_PASSWORD: $(INITIAL-ADMIN-PASSWORD)

          - task: PublishPipelineArtifact@1
            displayName: Publish Playwright report on failure
            condition: failed()
            inputs:
              targetPath: client/playwright-report
              artifact: playwright-report
