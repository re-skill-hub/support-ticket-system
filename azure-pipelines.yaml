trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  - name: services
    type: object
    default:
      - name: ticket-service
        dockerfile: services/TicketService/Dockerfile
      - name: response-service
        dockerfile: services/ResponseService/Dockerfile
      - name: notification-service
        dockerfile: services/NotificationService/Dockerfile
      - name: client
        dockerfile: client/Dockerfile

variables:
  - group: support-ticketing-dev
  - group: support-ticketing-dev-secrets
  - name: imageTag
    value: $(Build.SourceVersion)
  - name: dotnetVersion
    value: '10.0.x'
  - name: nodeVersion
    value: '24.x'
  - name: overlayPath
    value: k8s/azure-dev

stages:
  - stage: Validate
    displayName: Validate
    jobs:
      - job: Validate
        timeoutInMinutes: 15
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: Cache NuGet packages
            inputs:
              key: 'nuget | "$(Agent.OS)" | **/*.csproj'
              restoreKeys: 'nuget | "$(Agent.OS)"'
              path: $(NUGET_PACKAGES)

          - script: dotnet restore SupportTicketing.slnx
            displayName: Restore .NET

          - script: dotnet build SupportTicketing.slnx --no-restore --configuration Release
            displayName: Build .NET

          - script: dotnet test SupportTicketing.slnx --no-build --configuration Release --logger "console;verbosity=normal"
            displayName: Test .NET

          - task: Cache@2
            displayName: Cache npm packages
            inputs:
              key: 'npm | "$(Agent.OS)" | client/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(Pipeline.Workspace)/.npm

          - script: npm ci
            displayName: Install Angular dependencies
            workingDirectory: client
            env:
              npm_config_cache: $(Pipeline.Workspace)/.npm

          - script: npm test -- --watch=false
            displayName: Test Angular
            workingDirectory: client
            env:
              CI: true

          - script: npm run build
            displayName: Build Angular
            workingDirectory: client

          - script: kubectl kustomize $(overlayPath) > /dev/null
            displayName: Validate Kubernetes overlay renders

  - stage: BuildAndPush
    displayName: Build and push images
    dependsOn: Validate
    # Pull requests only run Validate — pushing images and deploying must wait until the PR is merged.
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildAndPush
        timeoutInMinutes: 15
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: ACR login
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: az acr login --name "$(acrName)"

          ${{ each svc in parameters.services }}:
            - script: docker build -t "$(acrLoginServer)/${{ svc.name }}:$(imageTag)" -f ${{ svc.dockerfile }} .
              displayName: 'Build ${{ svc.name }}'

            - script: docker push "$(acrLoginServer)/${{ svc.name }}:$(imageTag)"
              displayName: 'Push ${{ svc.name }}'

          - task: PublishPipelineArtifact@1
            displayName: Publish Kubernetes overlay
            inputs:
              targetPath: $(overlayPath)
              artifact: kubernetes-overlay

  - stage: DeployDev
    displayName: Deploy development
    dependsOn: BuildAndPush
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployDev
        environment: support-ticketing-dev
        timeoutInMinutes: 10
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Deploy to AKS
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      overlay="$(Pipeline.Workspace)/kubernetes-overlay"
                      # az aks get-credentials only populates the cluster server URL + CA cert here;
                      # the credential it hands out is swapped below for the namespace-scoped
                      # ci-deployer ServiceAccount token (see k8s/azure-dev/ci-deployer-rbac.yaml),
                      # since this cluster has no AAD integration and can't scope Azure RBAC instead.
                      az aks get-credentials --resource-group "$(resourceGroup)" --name "$(aksName)" --overwrite-existing
                      kubectl config set-credentials ci-deployer --token="$K8S_CI_TOKEN"
                      kubectl config set-context --current --user=ci-deployer --namespace="$(kubernetesNamespace)"
                      kubectl apply -f "$overlay/namespace.yaml"
                      kubectl create secret generic app-secrets \
                        --namespace "$(kubernetesNamespace)" \
                        --from-literal=MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
                        --from-literal=RABBITMQ_USER="$RABBITMQ_USER" \
                        --from-literal=RABBITMQ_PASS="$RABBITMQ_PASS" \
                        --from-literal=JWT_SECRET="$JWT_SECRET" \
                        --dry-run=client -o yaml | kubectl apply -f -
                      sed -i "s#__CLIENT_ENDPOINT__#$(clientEndpoint)#g" "$overlay/kustomization.yaml"
                      for d in ticket-service response-service notification-service; do
                        kubectl -n "$(kubernetesNamespace)" set env "deployment/$d" Cors__AllowedOrigin- 2>/dev/null || true
                      done
                      kubectl apply -k "$overlay"
                  env:
                    MSSQL_SA_PASSWORD: $(MSSQL-SA-PASSWORD)
                    RABBITMQ_USER: $(RABBITMQ-USER)
                    RABBITMQ_PASS: $(RABBITMQ-PASS)
                    JWT_SECRET: $(JWT-SECRET)
                    K8S_CI_TOKEN: $(K8S-CI-TOKEN)

                ${{ each svc in parameters.services }}:
                  - script: |
                      kubectl -n "$(kubernetesNamespace)" set image deployment/${{ svc.name }} ${{ svc.name }}="$(acrLoginServer)/${{ svc.name }}:$(imageTag)"
                      kubectl -n "$(kubernetesNamespace)" rollout status deployment/${{ svc.name }} --timeout=5m
                    displayName: 'Deploy ${{ svc.name }}'

                - task: AzureCLI@2
                  displayName: Capture AKS diagnostics on failure
                  condition: failed()
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials --resource-group "$(resourceGroup)" --name "$(aksName)" --overwrite-existing || true
                      kubectl config set-credentials ci-deployer --token="$K8S_CI_TOKEN" || true
                      kubectl config set-context --current --user=ci-deployer --namespace="$(kubernetesNamespace)" || true
                      kubectl -n "$(kubernetesNamespace)" get pods -o wide || true
                      kubectl -n "$(kubernetesNamespace)" get events --sort-by=.lastTimestamp || true
                      kubectl -n "$(kubernetesNamespace)" describe pods || true
                  env:
                    K8S_CI_TOKEN: $(K8S-CI-TOKEN)

  - stage: SmokeTest
    displayName: Smoke test
    dependsOn: DeployDev
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: SmokeTest
        timeoutInMinutes: 5
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: |
              set -euo pipefail
              test -n "$(clientEndpoint)"
              curl --fail --retry 5 --retry-delay 5 "$(clientEndpoint)/"
            displayName: Verify client endpoint
