name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SupportTicketing.slnx

      - name: Build
        run: dotnet build SupportTicketing.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SupportTicketing.slnx --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Build service Docker images
        run: |
          docker build -t ticket-service:ci -f services/TicketService/Dockerfile .
          docker build -t response-service:ci -f services/ResponseService/Dockerfile .
          docker build -t notification-service:ci -f services/NotificationService/Dockerfile .

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
        env:
          CI: "true"

      - name: Build
        run: npm run build

      - name: Build client Docker image
        working-directory: .
        run: docker build -t client:ci -f client/Dockerfile .
