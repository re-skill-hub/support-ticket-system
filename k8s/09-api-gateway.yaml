apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: Cors__AllowedOrigin
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CORS_ALLOWED_ORIGIN
            # Each backend Service now exposes a "debug" port (5101/5102/5103, for hitting it
            # directly from the host) and an "internal" port (8080, matching its container port)
            # — see the comment on ticket-service's Service. This targets "internal" since that's
            # the in-cluster convention nginx.conf uses too, now that it routes through this gateway.
            - name: ReverseProxy__Clusters__ticketServiceCluster__Destinations__destination1__Address
              value: "http://ticket-service:8080"
            - name: ReverseProxy__Clusters__responseServiceCluster__Destinations__destination1__Address
              value: "http://response-service:8080"
            - name: ReverseProxy__Clusters__notificationServiceCluster__Destinations__destination1__Address
              value: "http://notification-service:8080"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: debug
      port: 5100
      targetPort: 8080
    - name: internal
      port: 8080
      targetPort: 8080
