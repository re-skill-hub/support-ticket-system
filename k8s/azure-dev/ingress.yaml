# Routes the free nip.io hostname (resolves to the static IP bound to the
# ingress-nginx controller's Service) to the client app, with a cert-manager-issued
# TLS certificate. Start with letsencrypt-staging; switch to letsencrypt-prod only
# once staging issues successfully (see k8s/azure-dev/cluster-issuer.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - 52.152.144.127.nip.io
      secretName: client-tls
  rules:
    - host: 52.152.144.127.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 4200
