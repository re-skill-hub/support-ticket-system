# cert-manager ClusterIssuers for the trial AKS deployment. Apply after cert-manager
# is installed and its webhook is Ready. Replace <your-email@example.com> with a real
# address before applying — Let's Encrypt uses it only for expiry/revocation notices.
#
# Start with letsencrypt-staging (higher rate limits, untrusted test CA) while wiring
# up the Ingress; switch the Ingress's cert-manager.io/cluster-issuer annotation to
# letsencrypt-prod only once staging issues successfully, to avoid burning the
# production CA's much stricter rate limits on trial-and-error.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: bisan.laish@in.ibm.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: bisan.laish@in.ibm.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
