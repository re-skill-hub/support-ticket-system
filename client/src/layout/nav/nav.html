<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" routerLink="/">Support Ticketing</a>

    @if (authService.isAuthenticated()) {
      <button
        class="navbar-toggler"
        type="button"
        (click)="collapsed.set(!collapsed())"
        [attr.aria-expanded]="!collapsed()"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" [ngbCollapse]="collapsed()">
        <ul class="navbar-nav me-auto">
          @if (authService.isCustomer()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/tickets" routerLinkActive="active">My Tickets</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/tickets/new" routerLinkActive="active">New Ticket</a>
            </li>
          }
        </ul>

        <ul class="navbar-nav align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link position-relative" routerLink="/notifications" routerLinkActive="active">
              <i class="bi bi-bell"></i>
              @if (notificationService.unreadCount() > 0) {
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger">
                  {{ notificationService.unreadCount() }}
                </span>
              }
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/profile" routerLinkActive="active">{{ authService.currentUser()?.fullName }}</a>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm ms-lg-2" (click)="logout()">Logout</button>
          </li>
        </ul>
      </div>
    }
  </div>
</nav>
