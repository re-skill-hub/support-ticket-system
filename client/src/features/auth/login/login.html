<div class="auth-page">
  <div class="card auth-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-headset fs-1 text-primary"></i>
        <h1 class="h4 mt-2 mb-0">Sign in</h1>
        <p class="text-secondary small mb-0">Support Ticketing System</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            autocomplete="email"
            [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
          />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <div class="invalid-feedback">Enter a valid email address.</div>
          }
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
          />
          @if (form.controls.password.invalid && form.controls.password.touched) {
            <div class="invalid-feedback">Password is required.</div>
          }
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid || loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          } @else {
            Sign in
          }
        </button>
      </form>

      <p class="text-center small text-secondary mt-4 mb-0">
        Don't have an account? <a routerLink="/register">Register</a>
      </p>
    </div>
  </div>
</div>
