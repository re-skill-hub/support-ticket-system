<div class="app-page service-unavailable-page">
  <div class="card">
    <div class="card-body p-4 text-center">
      <i class="bi bi-plug fs-1 text-secondary"></i>
      <h1 class="h5 mt-2 mb-1">Service unavailable</h1>
      <p class="mb-4">We can't reach the server right now. Please check your connection and try again.</p>
      <button type="button" class="btn btn-primary" (click)="reload()">Try again</button>
    </div>
  </div>
</div>
