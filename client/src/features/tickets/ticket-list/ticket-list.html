<div class="ticket-list-page">
  <div class="header">
    <h2>My Tickets</h2>
    <a mat-flat-button color="primary" routerLink="/tickets/new">New Ticket</a>
  </div>

  @if (loading()) {
    <mat-spinner diameter="40" />
  } @else if (!hasAnyTickets()) {
    <p class="empty">You haven't raised any tickets yet.</p>
  } @else {
    <mat-form-field appearance="outline" class="search">
      <mat-label>Search by title</mat-label>
      <input matInput (input)="applyFilter($any($event.target).value)" placeholder="e.g. login issue" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
        <td mat-cell *matCellDef="let ticket">{{ ticket.title }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let ticket"><app-status-chip [status]="ticket.status" /></td>
      </ng-container>

      <ng-container matColumnDef="createdAtUtc">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
        <td mat-cell *matCellDef="let ticket">{{ ticket.createdAtUtc | date: 'medium' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let ticket">
          <a mat-button color="primary" [routerLink]="['/tickets', ticket.id]">View</a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" [attr.colspan]="columns.length">No tickets match your search.</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" pageSize="10" showFirstLastButtons />
  }
</div>
