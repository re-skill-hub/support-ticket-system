<div class="ticket-list-page">
  <div class="header">
    <h2>My Tickets</h2>
    <a mat-flat-button color="primary" routerLink="/tickets/new">New Ticket</a>
  </div>

  @if (loading()) {
    <mat-spinner diameter="40" />
  } @else if (tickets().length === 0) {
    <p class="empty">You haven't raised any tickets yet.</p>
  } @else {
    <table mat-table [dataSource]="tickets()" class="mat-elevation-z1">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let ticket">{{ ticket.title }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let ticket"><app-status-chip [status]="ticket.status" /></td>
      </ng-container>

      <ng-container matColumnDef="createdAtUtc">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let ticket">{{ ticket.createdAtUtc | date: 'medium' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let ticket">
          <a mat-button color="primary" [routerLink]="['/tickets', ticket.id]">View</a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  }
</div>
