<div class="not-found-page">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Page not found</mat-card-title>
      <mat-card-subtitle>404</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>The page you're looking for doesn't exist or has moved.</p>
    </mat-card-content>
    <mat-card-actions>
      <a mat-flat-button color="primary" routerLink="/">Back to home</a>
    </mat-card-actions>
  </mat-card>
</div>
