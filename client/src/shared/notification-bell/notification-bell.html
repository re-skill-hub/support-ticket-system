<!--
  display="dynamic" is required, not optional: NgbDropdown defaults `display` to 'static'
  whenever its host sits inside any .navbar-classed ancestor (true here in both the customer top
  navbar and the agent shell's mobile nav) — and 'static' mode skips Popper positioning entirely,
  so `placement` below is silently ignored and the menu renders wherever its raw, unpositioned
  absolute fallback happens to land. Forcing 'dynamic' is what actually makes `placement` and
  `container="body"` take effect.
-->
<div
  ngbDropdown
  container="body"
  placement="bottom-end"
  display="dynamic"
  (openChange)="onOpenChange($event)"
  class="notification-bell d-inline-block"
>
  <button
    type="button"
    ngbDropdownToggle
    [class]="toggleClass()"
    aria-label="Notifications"
  >
    <i class="bi bi-bell"></i>
    @if (label()) {
      <span class="ms-2">{{ label() }}</span>
    }
    @if (unreadCount() > 0) {
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger">
        {{ unreadCount() }}
      </span>
    }
  </button>

  <div ngbDropdownMenu class="notification-bell-menu dropdown-menu-end">
    <h6 class="dropdown-header">Notifications</h6>

    @if (loading()) {
      <div class="dropdown-item-text text-secondary small">Loading…</div>
    } @else if (preview().length === 0) {
      <div class="dropdown-item-text text-secondary small">No notifications yet.</div>
    } @else {
      @for (notification of preview(); track notification.id) {
        <div class="dropdown-item-text notification-bell-item" [class.unread]="!notification.readAtUtc">
          <a class="text-decoration-none" [routerLink]="['/tickets', notification.ticketId]">
            {{ notification.message }}
          </a>
          <div class="d-flex justify-content-between align-items-center mt-1">
            <span class="text-secondary small">{{ notification.createdAtUtc | relativeTime }}</span>
            @if (!notification.readAtUtc) {
              <button
                type="button"
                class="btn btn-link btn-sm p-0 small"
                (click)="markAsRead(notification)"
              >
                Mark as read
              </button>
            }
          </div>
        </div>
      }
    }

    <div class="dropdown-divider"></div>
    <a class="dropdown-item text-center" routerLink="/notifications">View all</a>
  </div>
</div>
