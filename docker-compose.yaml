networks:
  support-net:
    driver: bridge

volumes:
  sqlserver-data:
  rabbitmq-data:

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - support-net

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - support-net

  ticket-service:
    build:
      context: .
      dockerfile: services/TicketService/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=TicketServiceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: SupportTicketing
      Jwt__Audience: SupportTicketing.Clients
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Cors__AllowedOrigin: http://localhost:4200
      ASPNETCORE_ENVIRONMENT: Development
      LocalAgent__Email: ${LOCAL_AGENT_EMAIL:-}
      LocalAgent__Password: ${LOCAL_AGENT_PASSWORD:-}
      LocalAgent__FullName: ${LOCAL_AGENT_FULL_NAME:-Local Support Agent}
    ports:
      - "127.0.0.1:5101:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - support-net

  response-service:
    build:
      context: .
      dockerfile: services/ResponseService/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=ResponseServiceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: SupportTicketing
      Jwt__Audience: SupportTicketing.Clients
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Cors__AllowedOrigin: http://localhost:4200
    ports:
      - "127.0.0.1:5102:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - support-net

  notification-service:
    build:
      context: .
      dockerfile: services/NotificationService/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=NotificationServiceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: SupportTicketing
      Jwt__Audience: SupportTicketing.Clients
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASS}
      Cors__AllowedOrigin: http://localhost:4200
    ports:
      - "127.0.0.1:5103:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - support-net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      ticket-service:
        condition: service_healthy
      response-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - support-net
